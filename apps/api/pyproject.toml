[project]
name = "aquaculture-rag-api"
version = "0.1.0"
description = "Aquaculture RAG thesis system - API and ingestion worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "qdrant-client==1.12.1",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "jieba>=0.42",
]

[project.optional-dependencies]
bge = [
    "flagembedding>=1.3.0,<2",
]

[tool.uv]
# 环境完全由 uv 管理：只使用 uv 自带的 Python，不依赖 conda / 系统 Python
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "reportlab>=4.2",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "RUF012", "BLE001", "S112"]
